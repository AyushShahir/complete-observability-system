
# ----------------------------------
# LOKI CONFIGURATION
# ----------------------------------

# Authentication disabled for local learning
auth_enabled: false


# ----------------------------------
# SERVER CONFIGURATION
# ----------------------------------

server:
  http_listen_port: 3100
  grpc_listen_port: 9096


# ----------------------------------
# STORAGE CONFIGURATION
# ----------------------------------

common:
  instance_addr: 127.0.0.1

  path_prefix: /loki

  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules

  replication_factor: 1

  ring:
    kvstore:
      store: inmemory


# ----------------------------------
# INDEX CONFIGURATION
# ----------------------------------

schema_config:
  configs:
    - from: "2024-01-01"
      store: tsdb
      object_store: filesystem
      schema: v13

      index:
        prefix: index_
        period: 24h


# ----------------------------------
# LOGGING LIMITS
# ----------------------------------

limits_config:
  allow_structured_metadata: true

